<section class="techs">

  <div class="techs-header">
    <h3 class="section-title">{{ 'sections.technologies' | translate }}</h3>
    <div class="title-line"></div>
  </div>

  <!-- Frontend -->
  <div class="category-block">
    <span class="cat-label cat-frontend">⬡ Frontend</span>
    <div class="tech-grid">
      <div
        class="tech-card"
        *ngFor="let tech of frontend; let i = index"
        [style.--tech-color]="tech.color"
        [style.animation-delay]="(i * 0.08) + 's'">
        <div class="icon-wrap">
          <img [src]="tech.icon" [alt]="tech.name" class="tech-icon">
        </div>
        <span class="tech-name">{{ tech.name }}</span>
      </div>
    </div>
  </div>

  <!-- Backend -->
  <div class="category-block">
    <span class="cat-label cat-backend">⬡ Backend</span>
    <div class="tech-grid tech-grid--backend">
      <div
        class="tech-card"
        *ngFor="let tech of backend; let i = index"
        [style.--tech-color]="tech.color"
        [style.animation-delay]="((frontend.length + i) * 0.08) + 's'">
        <div class="icon-wrap">
          <img [src]="tech.icon" [alt]="tech.name" class="tech-icon">
        </div>
        <span class="tech-name">{{ tech.name }}</span>
      </div>
    </div>
  </div>

</section>
